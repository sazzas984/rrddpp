name: Windows RDP Runner (Chrome & Firefox - Free Pinggy)

on:
  workflow_dispatch:

jobs:
  windows-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable Remote Desktop (RDP)
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Set RDP Administrator Credentials
        run: |
          $Password = ConvertTo-SecureString "GitHubRDP@2026!" -AsPlainText -Force
          New-LocalUser -Name "runneradmin" -Password $Password -FullName "Admin" -Description "RDP Admin" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "runneradmin" -ErrorAction SilentlyContinue

      - name: Install Google Chrome & Mozilla Firefox
        shell: pwsh
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          Write-Host "Checking/Installing Google Chrome..."
          winget install --id Google.Chrome -e --silent --accept-package-agreements --accept-source-agreements
          Write-Host "Checking/Installing Mozilla Firefox..."
          winget install --id Mozilla.Firefox -e --silent --accept-package-agreements --accept-source-agreements
          exit 0

      - name: Setup SSH Key
        shell: pwsh
        run: |
          if (!(Test-Path "$HOME\.ssh\id_rsa")) {
              ssh-keygen -t rsa -b 2048 -N '""' -f "$HOME\.ssh\id_rsa"
          }

      - name: Start Free Pinggy TCP Tunnel (Port 3389)
        shell: pwsh
        run: |
          Write-Host "Starting free Pinggy TCP tunnel..."
          Start-Process ssh -ArgumentList "-p 443 -o StrictHostKeyChecking=no -R0:127.0.0.1:3389 tcp@free.pinggy.io" -RedirectStandardOutput "pinggy.log" -RedirectStandardError "pinggy_err.log" -NoNewWindow
          
          Start-Sleep -Seconds 8
          
          if (Test-Path "pinggy.log") {
              $logContent = Get-Content "pinggy.log" -Raw
              Write-Host "=================================================="
              Write-Host " PINGGY TUNNEL OUTPUT (LOOK FOR YOUR ADDRESS BELOW):"
              Write-Host $logContent
              Write-Host "=================================================="
          }
          
          Write-Host "=================================================="
          Write-Host " WINDOWS RDP DESKTOP READY!"
          Write-Host " Username : runneradmin"
          Write-Host " Password : GitHubRDP@2026!"
          Write-Host " Copy your public TCP endpoint from the logs above"
          Write-Host " (e.g., a.pinggy.link:XXXXX) and paste it into mstsc!"
          Write-Host "=================================================="

      - name: Keep Runner Alive
        shell: pwsh
        run: |
          $i = 0
          while ($i -lt 360) {
              Start-Sleep -Seconds 60
              $i++
              Write-Host "Heartbeat min $i/360..."
          }
