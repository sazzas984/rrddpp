name: Windows RDP Runner

on:
  workflow_dispatch:
    inputs:
      ngrok_auth_token:
        description: 'Ngrok Auth Token'
        required: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable Remote Desktop (RDP)
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Set RDP Credentials
        run: |
          $Password = ConvertTo-SecureString "GitHubRDP@2026!" -AsPlainText -Force
          New-LocalUser -Name "runneradmin" -Password $Password -FullName "Admin" -Description "RDP Admin" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "runneradmin" -ErrorAction SilentlyContinue

      - name: Install & Configure Ngrok
        run: |
          Invoke-WebRequest -Uri https://bin.equinox.io/c/bNyA1xQZYv/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
          Expand-Archive ngrok.zip -DestinationPath .
          .\ngrok.exe config add-authtoken ${{ github.event.inputs.ngrok_auth_token }}

      - name: Start Ngrok RDP Tunnel
        run: |
          Start-Process .\ngrok.exe -ArgumentList "tcp 3389" -NoNewWindow
          Start-Sleep -Seconds 5
          $Response = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels"
          $RDP_URL = $Response.tunnels[0].public_url
          Write-Host "=========================================="
          Write-Host "  WINDOWS RDP READY"
          Write-Host "  Address: $RDP_URL"
          Write-Host "  Username: runneradmin"
          Write-Host "  Password: GitHubRDP@2026!"
          Write-Host "=========================================="

      - name: Keep Runner Alive
        run: |
          $i = 0
          while ($i -lt 360) {
              Start-Sleep -Seconds 60
              $i++
              Write-Host "Heartbeat min $i/360..."
          }
