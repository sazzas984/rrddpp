name: Windows RDP Runner (Ngrok)

on:
  workflow_dispatch:
    inputs:
      ngrok_auth_token:
        description: 'Ngrok Auth Token (from ngrok.com)'
        required: true

jobs:
  windows-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable Remote Desktop (RDP)
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Set RDP Administrator Credentials
        run: |
          $Password = ConvertTo-SecureString "GitHubRDP@2026!" -AsPlainText -Force
          New-LocalUser -Name "runneradmin" -Password $Password -FullName "Admin" -Description "RDP Admin" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "runneradmin" -ErrorAction SilentlyContinue

      - name: Install Google Chrome & Mozilla Firefox
        shell: pwsh
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          Write-Host "Checking/Installing Google Chrome..."
          winget install --id Google.Chrome -e --silent --accept-package-agreements --accept-source-agreements
          Write-Host "Checking/Installing Mozilla Firefox..."
          winget install --id Mozilla.Firefox -e --silent --accept-package-agreements --accept-source-agreements
          exit 0

      - name: Install & Configure Ngrok
        shell: pwsh
        run: |
          Write-Host "Installing Ngrok via Microsoft Store WinGet..."
          winget install ngrok -s msstore --accept-source-agreements --accept-package-agreements --silent
          
          # Refresh environment path
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          
          Write-Host "Configuring Ngrok Auth Token..."
          ngrok config add-authtoken ${{ github.event.inputs.ngrok_auth_token }}

      - name: Start Ngrok TCP Tunnel (Port 3389)
        shell: pwsh
        run: |
          Write-Host "Starting Ngrok TCP tunnel..."
          Start-Process ngrok -ArgumentList "tcp 3389" -NoNewWindow
          
          # Wait for tunnel to spin up and fetch endpoint from local API
          Start-Sleep -Seconds 7
          try {
              $Response = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels"
              $RDP_URL = $Response.tunnels[0].public_url
              Write-Host "=================================================="
              Write-Host " NGROK RDP ENDPOINT: $RDP_URL"
              Write-Host "=================================================="
              echo "::notice ::RDP Endpoint: $RDP_URL"
          } catch {
              Write-Host "Could not fetch tunnel endpoint automatically from local API."
          }

      - name: Keep Runner Alive
        shell: pwsh
        run: |
          $i = 0
          while ($i -lt 360) {
              Start-Sleep -Seconds 60
              $i++
              Write-Host "Heartbeat min $i/360..."
          }
