name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable Remote Desktop (RDP)
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Set RDP Administrator Credentials
        run: |
          $Password = ConvertTo-SecureString "GitHubRDP@2026!" -AsPlainText -Force
          New-LocalUser -Name "runneradmin" -Password $Password -FullName "Admin" -Description "RDP Admin" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "runneradmin" -ErrorAction SilentlyContinue

      - name: Install Google Chrome & Mozilla Firefox
        shell: pwsh
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          Write-Host "Installing Google Chrome..."
          winget install --id Google.Chrome -e --silent --accept-package-agreements --accept-source-agreements
          Write-Host "Installing Mozilla Firefox..."
          winget install --id Mozilla.Firefox -e --silent --accept-package-agreements --accept-source-agreements
          exit 0

      - name: Start Free Serveo TCP Tunnel (Port 3389)
        shell: pwsh
        run: |
          Write-Host "Starting Serveo TCP tunnel on port 443..."
          
          $psi = [System.Diagnostics.ProcessStartInfo]::new()
          $psi.FileName = "ssh"
          $psi.Arguments = "-p 443 -o StrictHostKeyChecking=no -R 0:localhost:3389 serveo.net"
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.UseShellExecute = $false
          
          $p = [System.Diagnostics.Process]::Start($psi)
          
          $sw = [Diagnostics.Stopwatch]::StartNew()
          while ($sw.ElapsedMilliseconds -lt 8000) {
              if (!$p.StandardError.EndOfStream) {
                  $line = $p.StandardError.ReadLine()
                  Write-Host "TUNNEL OUTPUT: $line"
              }
              if (!$p.StandardOutput.EndOfStream) {
                  $line = $p.StandardOutput.ReadLine()
                  Write-Host "TUNNEL OUTPUT: $line"
              }
              Start-Sleep -Milliseconds 100
          }
          
          Write-Host "=================================================="
          Write-Host " WINDOWS RDP DESKTOP READY!"
          Write-Host " Username : runneradmin"
          Write-Host " Password : GitHubRDP@2026!"
          Write-Host " Look above for: Forwarding TCP connections from serveo.net:XXXXX"
          Write-Host "=================================================="

      - name: Keep Runner Alive
        shell: pwsh
        run: |
          $i = 0
          while ($i -lt 360) {
              Start-Sleep -Seconds 60
              $i++
              Write-Host "Heartbeat min $i/360..."
          }
