name: Remote Desktop Runner

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: 'Session Identifier from Web Application'
        required: false
        default: 'session-001'
      connection_type:
        description: 'Connection Method (novnc / ngrok-rdp / tmate)'
        required: false
        default: 'novnc'

jobs:
  launch-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Maximum GitHub runner execution limit (6 hours)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment Variables
        run: |
          echo "SESSION_ID=${{ github.event.inputs.session_id }}" >> $GITHUB_ENV
          echo "CONN_TYPE=${{ github.event.inputs.connection_type }}" >> $GITHUB_ENV

      # Option A: Linux GUI Desktop + VNC + noVNC Web Screen Share
      - name: Install Desktop Environment & noVNC
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            xfce4 \
            xfce4-terminal \
            tightvncserver \
            novnc \
            websockify \
            python3-websockify \
            x11vnc \
            xvfb \
            curl \
            jq

      - name: Start Virtual Display & Desktop (Xvfb + XFCE4)
        run: |
          # Start Xvfb virtual frame buffer (Resolution: 1280x720 24-bit color)
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          sleep 2

          # Start XFCE4 Desktop Session
          dbus-launch startxfce4 &
          sleep 3

      - name: Start VNC & noVNC Web Stream
        run: |
          export DISPLAY=:99
          # Run x11vnc server on display :99 port 5900
          x11vnc -display :99 -forever -shared -rfbport 5900 -nopw &
          sleep 2

          # Start noVNC proxy mapping WebSocket port 6080 -> VNC port 5900
          websockify --web /usr/share/novnc/ 6080 localhost:5900 &
          sleep 2

      - name: Setup Public Tunnel (Pinggy / LocalTunnel)
        id: tunnel
        run: |
          echo "Starting public web tunnel for screen sharing..."
          
          # Option 1: Pinggy SSH Tunnel for noVNC (Port 6080)
          # Exposes noVNC web viewer to HTTPS
          ssh -o StrictHostKeyChecking=no -R 80:localhost:6080 a.pinggy.io > pinggy.log 2>&1 &
          sleep 5

          # Extract public HTTPS URL from tunnel logs
          STREAM_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.pinggy\.link' pinggy.log | head -n 1 || echo "")
          
          if [ -z "$STREAM_URL" ]; then
            # Fallback to localtunnel if Pinggy is unavailable
            npx localtunnel --port 6080 > lt.log 2>&1 &
            sleep 5
            STREAM_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.loca\.lt' lt.log | head -n 1 || echo "")
          fi

          echo "STREAM_URL=$STREAM_URL" >> $GITHUB_ENV
          echo "::notice ::Live Stream URL: $STREAM_URL/vnc.html?autoconnect=true&resize=scale"

      - name: Send Status & Screen Stream Link to WebApp Webhook (Optional)
        run: |
          echo "=========================================="
          echo "  REMOTE DESKTOP READY FOR WEB APP"
          echo "  Session ID : $SESSION_ID"
          echo "  Stream URL : $STREAM_URL/vnc.html?autoconnect=true&resize=scale"
          echo "=========================================="

      - name: Keep-Alive Runner Loop
        run: |
          echo "Remote Desktop is active. Keeping workflow alive..."
          # Keep runner alive for up to 6 hours or until manually cancelled
          for i in {1..360}; do
            echo "Session $SESSION_ID heartbeat min $i/360..."
            sleep 60
          done
