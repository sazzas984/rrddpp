name: Dashboard Connection Test

on:
  workflow_dispatch:
    inputs:
      report_id:
        description: "Test report identifier"
        required: true
        type: string

permissions:
  contents: read

jobs:
  connection-test:
    runs-on: ubuntu-latest
    steps:
      - name: Verify dashboard trigger
        env:
          REPORT_ID: ${{ inputs.report_id }}
        run: |
          if [[ ! "$REPORT_ID" =~ ^[A-Za-z0-9_-]{1,64}$ ]]; then
            echo "Invalid report ID"
            exit 1
          fi
          echo "Dashboard trigger received successfully."
          echo "Report ID: $REPORT_ID"
